# Phase 2 extraction targets: what to locate in each document, and where.
#
# Nothing source-shaped belongs in code — same rule as sources.yml and dq_rules.yml.
# The argument is sharper here than usual, because THIS DATA HAS ALREADY BEEN
# DOCUMENTED WRONG ONCE.
#
# docs/source-recon.md §4 and §8 risk 6 both direct Phase 2 to section-target on
# §1.5 "Reason for Rate Change(s)" and Part II. Measured across all 26 PDFs in
# data/raw/: "Reason for Rate Change" appears ZERO times, "Written Explanation"
# zero, "Part II" twice in one packet. That numbering belongs to the older CMS
# Part II Written Explanation template; the PY2027 documents do not use it.
#
# What they use instead:
#   Oregon      — Part III Actuarial Memorandum numbered per the 2027 Unified Rate
#                 Review Instructions: 4.3, 4.4.3.1, 4.4.3.2(a)...
#   Pennsylvania— a numbered cover-letter response to PA Insurance Department
#                 PY2027 guidance, then a memorandum numbered 1.x
#
# See docs/decisions/0005-extraction-targets-and-section-location.md.

version: 1

model:
  # Model ID and prices are config, never constants. The price is stamped onto
  # each cost-log row at call time so a later rate change cannot retroactively
  # rewrite what a run cost.
  id: claude-opus-5
  effort: high
  max_tokens: 16000
  input_price_per_mtok: "5.00"
  output_price_per_mtok: "25.00"
  cache_write_multiplier: "1.25"
  cache_read_multiplier: "0.1"

limits:
  # A located window longer than this fails loudly as `window_exceeds_token_ceiling`.
  # It is NEVER truncated to fit: a truncated window produces a call that succeeds,
  # output that parses, and a section that is silently gone.
  max_window_tokens: 120000
  # Cap on pages per section window. A section whose next sibling was not located
  # would otherwise run to the end of a 409-page packet.
  #
  # Tuned against the real corpus rather than guessed. Located-window totals across
  # all 19 narrative documents, at $5/MTok input:
  #     3 pages -> ~258K tokens (~$1.29)      8 pages -> ~506K (~$2.53)
  #     4 pages -> ~323K tokens (~$1.61)     12 pages -> ~612K (~$3.06)
  # The section count is identical at every setting — only the window length
  # changes — so this is a pure cost/context tradeoff. 4 holds a section without
  # swallowing its neighbours.
  max_window_pages: 4
  # Pages scanned for the filing-identity block. Null means the whole document.
  #
  # Full-document scanning is safe here ONLY because every anchor carries its
  # label — see the note on `anchors` below. Page text is extracted once and
  # cached, so the scan itself costs nothing. It has to be full: the Part III
  # identity block ("Company Legal Name:", "HIOS Issuer ID:") sits on page 40 of
  # Regence's 150-page packet, not on the cover.
  identity_scan_pages: null


# ---------------------------------------------------------------------------
# Labeled anchors for filing-grain identity fields.
#
# EVERY pattern here carries its label. A bare pattern is forbidden, and the
# reason is measured, not theoretical:
#   * or-2027-indv-regence-bcbs/rate_request.pdf contains RGOR-134500256 —
#     a previous filing shown "Withdrawn 9/23/2025" — alongside the real
#     RGOR-134948633.
#   * pa-2027-indv-gqo/filing_packet.pdf contains GSHP-133664950, GSHP-134083390
#     and GSHP-134496843 in its own rate-history table, alongside the real
#     GSHP-134913003.
# A bare [A-Z]{4}-\d{9} match would key ADR 0002's int_filing_crosswalk to a
# withdrawn or historical filing, and nothing downstream would detect it.
# ---------------------------------------------------------------------------

anchors:
  OR:
    rate_request:
      serff_tracking_number:
        - 'SERFF\s*Tr\s*Num\s*:\s*([A-Z]{2,6}-\d{6,12})'
        - 'SERFF\s*Tracking\s*#\s*:\s*([A-Z]{2,6}-\d{6,12})'
      state_tracking_number:
        - 'State\s*Tr\s*Num\s*:\s*([A-Z]{2,6}-\d{6,12})'
      toi_code:
        - 'TOI\s*:\s*(H\d{2}[A-Z])'
      avg_rate_change_requested:
        - 'Overall\s+Rate\s+Impact\s*:\s*(-?[\d.]+)\s*%'
      date_submitted:
        - 'Date\s+Submitted\s*:\s*(\d{2}/\d{2}/\d{4})'
      # Cross-checks against the URRT, which is the primary for all three in OR.
      # The Part III identity block is deep in the packet (p.40 for Regence), so
      # these only resolve under a full-document scan.
      company_legal_name:
        - 'Company\s+Legal\s+Name\s*:\s*(.+)$'
        - '^\s*Company\s*:\s*(.+)$'
      hios_issuer_id:
        - 'HIOS\s*Issuer\s*ID\s*:?\s*(\d{4,6})'
      effective_date:
        - 'Effective\s+Date\s*:\s*(January\s+\d{1,2},\s*\d{4})'
        - 'EffectiveDate\s+Requested\s*:\s*(\d{2}/\d{2}/\d{4})'

  PA:
    filing_packet:
      # PRIMARY anchors only — fields that are uniformly labeled across all 15
      # carriers and cannot match a different metric. Measured 15/15 each.
      #
      # Everything else PA was moved to `cross_check_anchors` below. That is an
      # evidence-driven demotion, not caution: see the note there.
      hios_issuer_id:
        - 'HIOS\s*[Ii]ssuer\s*ID\s*:?\s*(\d{4,6})'
      effective_date:
        - 'Effective\s+date\s+of\s+coverage\s*:?\s*(January\s+\d{1,2},\s*\d{4})'
        - 'Effective\s+Date\s*:\s*(January\s+\d{1,2},\s*\d{4})'
        - 'Effective\s+Date\s*:\s*(\d{1,2}/\d{1,2}/\d{4})'


# ---------------------------------------------------------------------------
# CROSS-CHECK anchors. Corroborate an LLM value; never the primary source.
#
# Pennsylvania's 15 carriers all answer the same PA Insurance Department PY2027
# guidance, and they answer it in structurally incompatible ways. Measured:
#
#   pa-2027-indv-gqo   inline numbered list, values on the line:
#                        "5. Average rate change:13.0%"                 -> regex works
#   pa-2027-indv-hpp   numbered items used as HEADINGS, values elsewhere:
#                        "5. Average Rate Change Requested"             -> regex finds a heading
#   pa-2027-indv-ah    the answer is a TABLE CELL REFERENCE, not a number:
#                        "5. Average rate change requested (Table 11, cell AN13...)"
#
# On `ah` the regex returned 40.90% — a real figure from the document, but the
# change in 21-year-old non-tobacco premium PMPM, which is a DIFFERENT METRIC from
# the average rate change. That is the dangerous failure: not a miss, but a
# plausible wrong answer that nothing downstream would question.
#
# Coverage of these patterns across the 15 PA packets: serff 4/15, binder 6/15,
# naic 12/15, avg_rate_change 14/15 (one of them wrong), range 8/15,
# revenue 12/15, covered_lives 2/15, policyholders 2/15, plan_count 2/15.
#
# So these run, and their results are recorded as corroboration on the LLM's
# value. Agreement raises confidence; disagreement is recorded on the outcome row
# rather than silently resolved in either direction.
# ---------------------------------------------------------------------------

cross_check_anchors:
  PA:
    filing_packet:
      serff_tracking_number:
        - 'SERFF\s*Number\s*:\s*([A-Z]{2,6}-\d{6,12})'
        - 'SERFF\s*#\s*:\s*([A-Z]{2,6}-\s*\d{6,12})'
      binder_id:
        - 'Binder\s*ID\s*(?:Number|#)?\s*:\s*([A-Z0-9\-]+)'
      naic_number:
        - 'NAIC\s*#\s*:?\s*(\d{4,6})'
        - 'NAIC\s*(?:Number|Company\s*ID#)\s*:?\s*(\d{4,6})'
      avg_rate_change_requested:
        - 'Average\s+rate\s+change\s*:\s*(-?[\d.]+)\s*%'
      rate_change_range:
        - 'Range\s+of\s+rate\s+change[^:]{0,30}:\s*(-?[\d.]+\s*%\s*to\s*-?[\d.]+\s*%)'
      total_additional_revenue:
        - 'Total\s+additional\s+annual\s+revenue[^:]{0,80}:\s*\$([\d,]+)'
      covered_lives:
        - '([\d,]+)\s+covered\s+lives'
      policyholders:
        - '([\d,]+)\s+policyholders'
      plan_count_stated:
        - 'total\s+of\s+([\d,]+)\s+plans'
      company_legal_name:
        - 'Company\s+Legal\s+Name\s*:\s*(.+?)(?:\s+State\s*:|$)'

  OR:
    rate_request:
      # Oregon's anchors are already primary and 100%: they read SERFF's own
      # metadata block ("Overall Rate Impact: 12.22%"), which is a structured
      # field rather than carrier prose. Nothing to demote.
      {}


# ---------------------------------------------------------------------------
# Identity windows: the small page range the LLM reads for filing-grain fields.
#
# Only Pennsylvania needs one. Oregon's filing-grain fields all resolve from
# labeled anchors and the URRT, so Oregon spends no tokens on filing grain at all.
# ---------------------------------------------------------------------------

identity_windows:
  PA:
    filing_packet:
      # Carriers open with a cover letter answering the Department's numbered
      # PY2027 guidance. Anchor on whichever phrasing the carrier used.
      anchors:
        - "Department[’']s\\s+PY2027\\s+guidance"
        - 'Company\s+Name\s*(?:&|and)\s*NAIC'
        - 'Average\s+[Rr]ate\s+[Cc]hange\s+[Rr]equested'
        - 'Range\s+of\s+[Rr]ate\s+[Cc]hange'
      # Pages from the anchor. The guidance response runs 1-3 pages in every
      # packet measured; 6 is slack for carriers that use headings and spread out.
      pages_after: 6
      # If no anchor matches, fall back to the front of the document rather than
      # skipping — a filing with no locatable cover letter still gets read, and
      # the fallback is recorded in provenance.
      fallback_pages: 8


# ---------------------------------------------------------------------------
# Narrative sections. The LLM's actual job, and the ONLY thing tokens are spent on.
#
# Keys are the conformed vocabulary (schema.DriverCategory); the patterns are the
# two states' different ways of writing the same section.
# ---------------------------------------------------------------------------

sections:
  OR:
    rate_request:
      medical_trend:
        - '4\.4\.3\.1\s+Trend\s+Factors'
        - '^\s*Trend\s+Factors\s*$'
      morbidity:
        - '4\.4\.3\.2\(a\)\s+Morbidity'
        - 'Morbidity\s+Adjustment'
      demographic_shift:
        - '4\.4\.3\.2\(b\)\s+Demographic'
        - 'Demographic\s+Shift'
      plan_design_change:
        - '4\.4\.3\.2\(c\)\s+Plan\s+Design'
        - 'Plan\s+Design\s+Changes'
      risk_adjustment:
        - '4\.4\.3\.6\(b\)\s+Risk\s+Adjustment'
        - 'Risk\s+Adjustment\s+Payment/Charge'
      reinsurance:
        - '4\.4\.3\.6\(a\)\s+Reinsurance'
      admin_expense:
        - '4\.4\.7\(a\)\s+Administrative\s+Expense'
        - 'Administrative\s+Expense\s+Load'
      profit_risk_load:
        - '4\.4\.7\(b\)\s+Risk\s+Margin'
        - 'Risk\s+Margin\s+and\s+Contribution\s+to\s+Surplus'
      taxes_fees:
        - '4\.4\.7\(c\)\s+Taxes\s+and\s+Fees'
      other:
        - '4\.4\.3\.2\(d\)\s+Other\s+Adjustments'

    cost_containment:
      # 2-10 pages. Sent whole; no section location needed.
      cost_containment:
        - 'COST\s+CONTAINMENT'
        - 'Cost\s+Containment\s+and\s+Quality'

  PA:
    filing_packet:
      medical_trend:
        - 'Trend\s+(?:Factors|Assumptions)'
        - 'Changes\s+in\s+Medical\s+Service\s+Costs'
      rx_trend:
        - 'Prescription\s+Drug\s+Trend'
      morbidity:
        - 'Morbidity\s+(?:Adjustment|Change)'
      demographic_shift:
        - 'Demographic\s+(?:Shift|Change)'
      plan_design_change:
        - 'Plan\s+Design\s+Change'
        - 'Changes\s+in\s+Benefits'
      provider_contracting:
        - 'Provider\s+(?:Contracting|Network)\s+'
      risk_adjustment:
        - 'Risk\s+Adjustment'
      reinsurance:
        - 'Reinsurance'
      admin_expense:
        - 'Administrative\s+(?:Expense|Costs)'
      taxes_fees:
        - 'Taxes\s+and\s+Fees'
      profit_risk_load:
        - '(?:Profit|Risk)\s+(?:and\s+Risk\s+)?(?:Margin|Load)'
      subsidy_policy_change:
        # Present in the corpus: the enhanced ACA subsidies lapsed 2025-12-31 and
        # carriers discuss the effect explicitly. Not a hypothetical category.
        - 'Enhanced\s+Subsid'
        - 'Subsidies\s+Are\s+Restored'


# ---------------------------------------------------------------------------
# Plan-grain tables. Located deterministically, parsed deterministically.
# ---------------------------------------------------------------------------

plan_tables:
  PA:
    filing_packet:
      # The plan-level rate exhibits in the PA actuarial memorandum.
      anchors:
        - 'Table\s+10\b'
        - 'Table\s+11\b'
        - 'Plan\s+ID\s*\(Standard\s+Component\s+ID\)'
      # A page carrying at least this many Standard Component IDs is a plan table.
      min_plan_ids_per_page: 2


# ---------------------------------------------------------------------------
# Roles deliberately not extracted, with the reason recorded on every skip row.
# These are NOT omissions — each produces a `skipped` outcome row naming why.
# ---------------------------------------------------------------------------

skip_roles:
  rate_tables: superseded_by_urrt
  cost_metrics: superseded_by_urrt
  other: unmapped_role
