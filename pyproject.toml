[project]
name = "rate-filing-pipeline"
version = "0.1.0"
description = "Ingest, extract, and model ACA individual-market rate filings from PA and OR state DOIs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    # Phase 2 — extraction.
    "anthropic>=0.40",
    "pydantic>=2.7",
    # pypdf reads page text fast; pdfplumber reads table cells and recovers
    # numeric columns pypdf drops. Both are needed — see ADR 0005, "Using pypdf
    # for everything" under alternatives rejected.
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    # Phase 4 — warehouse. psycopg is the loader's only DB dependency; dbt-postgres
    # brings dbt-core. Disk stays the system of record (ADRs 0003/0006/0009);
    # Postgres is a downstream projection loaded by pipeline/load.
    "psycopg[binary]>=3.1",
    # Pinned to the 1.9 line: dbt-core >=1.10 depends on an experimental-parser
    # sdist that downloads a platform wheel from GitHub at build time — a
    # build-time network fetch (and observed SSL failure) a clean clone must not
    # inherit. 1.9 has native unit tests (>=1.8), which is all Phase 4 needs.
    "dbt-core==1.9.*",
    "dbt-postgres==1.9.*",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[project.scripts]
rfp-ingest = "pipeline.ingest.cli:main"
rfp-extract = "pipeline.extract.cli:main"
rfp-validate = "pipeline.validate.cli:main"
rfp-load = "pipeline.load.cli:main"
rfp-warehouse = "pipeline.load.warehouse:main"
rfp-cdc = "pipeline.cdc.cli:main"
rfp-run = "pipeline.orchestrate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real external sources; deselected by default (run with -m live)",
    "warehouse: needs the local Postgres container; deselected by default (run with -m warehouse)",
]
addopts = "-m 'not live and not warehouse'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
